name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          for f in src/*.mjs src/providers/*.mjs src/integrations/openclaw-plugin/*.js public/*.js test/*.mjs test/fixtures/*.mjs; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Design system check
        run: python kit/check.py public/index.html public/office.css public/page-core.js public/skills.js public/dialogs.js public/schedules.js public/extensions.js public/hq.js public/characters.js public/reception.js public/panels.js public/changes.js public/screens.js public/merge.js public/needs.js public/office.js public/adapter.js public/chat-extras.js public/city.js public/board.js public/terminal.js public/persona.js public/lobby.js public/desk.js public/wheel-gate.js public/vocab.js public/ask.js public/client.js public/screen-kit.js public/scene-host.js public/building.js public/format.js public/toasts.js public/wire.js public/security.js public/vocab-security.js public/vocab-layers.js public/vocab-persona.js components/bundle.css components/bundle.js kit/page.html
  # The office is Windows first. Some tests run only there (the /mcp routes with a real server, local tools, spawn safety).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests
        run: npm test
